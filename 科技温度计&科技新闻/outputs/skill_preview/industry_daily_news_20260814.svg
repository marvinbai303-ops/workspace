<text x="164" y="951" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26px" font-weight="700" fill="#102F57" text-anchor="start"><tspan x="164" dy="0px">国产大模型继续向开源和应用扩散</tspan></text>
<text x="164" y="984" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="19px" font-weight="400" fill="#56738F" text-anchor="start"><tspan x="164" dy="0px">Kimi K3等国产模型在开源、代码和智能体场景受到关注，竞争转向落地效率。</tspan></text>
