<text x="164" y="600" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26px" font-weight="700" fill="#102F57" text-anchor="start"><tspan x="164" dy="0px">Cisco AI订单升至93亿美元</tspan></text>
<text x="164" y="633" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="19px" font-weight="400" fill="#56738F" text-anchor="start"><tspan x="164" dy="0px">财年AI基础设施订单明显放量，网络设备开始成为算力扩张的直接受益环节。</tspan></text>
<text x="164" y="655" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16px" font-weight="400" fill="#1769C2" text-anchor="start"><tspan x="164" dy="0px">网络设备｜AI订单｜资本开支</tspan></text>
<rect x="44" y="674" width="936" height="110" rx="16" fill="#FFFFFF" stroke="#C4DDF4" stroke-width="2"/>
<rect x="66" y="699" width="70" height="48" rx="11" fill="#102F57" stroke="none" stroke-width="0"/>
