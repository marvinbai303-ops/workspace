<text x="164" y="834" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26px" font-weight="700" fill="#102F57" text-anchor="start"><tspan x="164" dy="0px">超微业绩超预期，股价一度大涨</tspan></text>
<text x="164" y="867" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="19px" font-weight="400" fill="#56738F" text-anchor="start"><tspan x="164" dy="0px">AI服务器厂商单季每股收益明显高于预期，算力需求继续向服务器整机环节传导。</tspan></text>
<text x="164" y="889" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16px" font-weight="400" fill="#1769C2" text-anchor="start"><tspan x="164" dy="0px">AI服务器｜业绩｜算力</tspan></text>
