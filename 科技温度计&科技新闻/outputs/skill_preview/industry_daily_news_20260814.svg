<text x="164" y="483" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26px" font-weight="700" fill="#102F57" text-anchor="start"><tspan x="164" dy="0px">英伟达联手六大机构“找钱”</tspan></text>
<text x="164" y="516" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="19px" font-weight="400" fill="#56738F" text-anchor="start"><tspan x="164" dy="0px">六家金融机构拟组建融资平台，超过5000亿美元第三方资本瞄准AI基础设施。</tspan></text>
<text x="164" y="538" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16px" font-weight="400" fill="#1769C2" text-anchor="start"><tspan x="164" dy="0px">英伟达｜华尔街｜AI基础设施</tspan></text>
