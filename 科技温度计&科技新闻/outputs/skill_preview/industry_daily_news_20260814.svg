<text x="925" y="1086" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="58px" font-weight="700" fill="#8FC8FF" text-anchor="middle"><tspan x="925" dy="0px">“</tspan></text>
<text x="242" y="1119" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="18px" font-weight="400" fill="#102F57" text-anchor="start"><tspan x="242" dy="0px">我们认为本期AI主线的核心变化，不是算力需求转弱，而是资本供给开始与芯片供给并</tspan><tspan x="242" dy="24px">行扩张。服务器、网络和设备环节的订单仍在验证需求，但融资结构也让市场从“投入即</tspan><tspan x="242" dy="24px">正义”转向审视现金流与兑现节奏。往后看，主线大概率缩圈至订单、交付和现金流更清</tspan><tspan x="242" dy="24px">晰的核心环节，纯融资驱动的高弹性标的仍需消化分歧。配置上维持均衡，对景气验证充</tspan><tspan x="242" dy="24px">分的方向保留仓位，对短期拥挤品种及时削峰填谷。</tspan></text>
<rect x="44" y="1252" width="936" height="216" rx="16" fill="#102F57" stroke="none" stroke-width="0"/>
<text x="68" y="1284" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="25px" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="68" dy="0px">市场底色</tspan></text>
<text x="68" y="1321" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="18px" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="68" dy="0px">海外流动性：PPI降温、长端收益率回落，利率路径仍在拉锯</tspan></text>
<text x="68" y="1354" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="18px" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="68" dy="0px">地缘与大类资产：油价回落、标普再创新高，风险偏好暂占上风</tspan></text>
<text x="68" y="1387" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="18px" font-weight="400" fill="#8FC8FF" text-anchor="start"><tspan x="68" dy="0px">国内政策：积极财政、适度宽松方向延续，增量政策仍待落地</tspan></text>
