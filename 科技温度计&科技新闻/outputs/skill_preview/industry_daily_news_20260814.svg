<text x="164" y="717" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26px" font-weight="700" fill="#102F57" text-anchor="start"><tspan x="164" dy="0px">应用材料迎来AI设备需求</tspan></text>
<text x="164" y="750" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="19px" font-weight="400" fill="#56738F" text-anchor="start"><tspan x="164" dy="0px">先进逻辑、HBM和先进封装共同拉动设备需求，半导体设备景气继续得到验证。</tspan></text>
<text x="164" y="772" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16px" font-weight="400" fill="#1769C2" text-anchor="start"><tspan x="164" dy="0px">半导体设备｜HBM｜先进封装</tspan></text>
<rect x="44" y="791" width="936" height="110" rx="16" fill="#FFFFFF" stroke="#C4DDF4" stroke-width="2"/>
<rect x="66" y="816" width="70" height="48" rx="11" fill="#1769C2" stroke="none" stroke-width="0"/>
