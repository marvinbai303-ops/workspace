industry_cn: 风电（含海风）
industry_en: wind_offshore
scope: >
  覆盖陆上风电与海上风电的新增装机需求，重点关注海上风电（海风）的景气加速周期。
  典型持仓包括金风科技、明阳智能、东方电缆、日月股份、海力风电、大金重工等。
typical_managers:
  - 东吴刘元海
  - 宏利基金孙硕

indicators:
  - file: wind_installation.csv
    name: 风电新增装机累计值（GW）
    columns: [date, cumulative_gw]
    frequency: monthly
    nature: coincident        # 装机是终端需求的直接体现，与整机、塔筒、海缆订单同步
    ifind_index_id: ~         # 已内嵌，来源：国家能源局
    use_for: >
      全国风电装机是判断整机厂商（金风、明阳）和零部件企业景气的核心指标。
      累计同比>25%意味着强旺盛需求；需特别关注海风装机数据（单独公布时优先使用）。
      季节性特征：风电装机Q4冲量显著（抢装潮），Q1通常低迷；用同比增速消除季节性。
      用法：装机超预期+核准项目增加（事件型信号） → 加仓整机/海缆/塔筒产业链。
    source: 国家能源局, via data file
    update:
      method: manual
      last_updated: "2026-02"
      next_expected: "2026-04"   # 国家能源局每月中旬发布
      note: >
        数据来源：国家能源局官网月度能源生产情况。
        可通过iFinD EDB搜索"风电 新增装机 当月"或"风电 装机容量"获取对应指标ID，
        建议搜索后使用get_edb_data自动更新。
        海风专项数据可另行搜索"海上风电 装机"指标，目前本文件为陆+海合并口径。

clock_logic: >
  风电产业时钟（政策驱动+周期叠加，典型抢装周期3-5年一次）：

  1. 【政策催化】补贴退坡公告/配额通知下发 → 开发商提前锁定订单，整机/零部件订单爆发
  2. 【招标先行】整机招标量同比大幅增加（领先装机约12-18个月）→ 整机和零部件供应商受益
  3. 【装机兑现】新增装机数据加速（同比>30%）→ 验证需求，塔筒/海缆等基础设施类公司利润兑现
  4. 【抢装顶部】政策截止日前集中并网 → 装机脉冲式放量，次年断崖风险需注意
  5. 【消纳瓶颈】装机大幅增加但弃风率上升 → 电网投资滞后制约，需关注特高压配套进度

  海风专项逻辑（与陆风差异）：
  - 海风核准：省级海风项目核准公告是领先信号（领先装机约24-36个月）
  - 海风造价：单GW投资额>陆风3倍，对海缆、桩基、安装船的需求更集中
  - 关键节点：2023年广东、山东大型海风项目陆续核准，2025-2026年进入集中装机期

  验证基金经理产业时钟感的关键节点：
  - 2020年：陆风补贴退坡前最后抢装，是否在年初重仓并在抢装后期撤出？
  - 2022-2023年：海风进入加速核准期，是否提前布局海缆（东方电缆）等稀缺环节？
  - 2024-2025年：海风进入集中装机，是否配置塔筒（大金重工）、桩基（海力风电）？

caveats:
  - 当前数据文件为风电总装机（陆+海合并），海风单独口径需另行获取
  - 风电装机受消纳政策（弃风率）和电价补贴政策双重影响，需结合政策事件分析
  - 整机招标量是比装机更领先的指标（领先12-18个月），目前数据集未包含招标量数据
  - 海上风电项目施工周期长（3-5年），核准到装机时滞大，需要长周期视角
  - 国家能源局数据含已建成并网容量，不等于当期订单需求，需配合招标/开工数据使用
