    fund_name: 景顺长城优质成长股票A
    company: 景顺长城基金
    tenure_start: "2023-11-07"
    manager_type: A       # A类：专注1-2个赛道（半导体/AI算力）
    primary_industries: [semiconductor]

  - name: 金梓才
