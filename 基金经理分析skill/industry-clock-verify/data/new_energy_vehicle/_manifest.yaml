industry_cn: 新能源汽车
industry_en: new_energy_vehicle
scope: >
  覆盖新能源汽车渗透率趋势与动力电池产业链景气，追踪从终端销量渗透率到电池装车量的需求链。
  典型持仓包括宁德时代、比亚迪、亿纬锂能、欣旺达、孚能科技、璞泰来等。
typical_managers:
  - 华商伍文友
  - 宏利基金孙硕

indicators:
  - file: nev_penetration.csv
    name: 新能源汽车批发渗透率（%）
    columns: [date, penetration_rate_pct]
    frequency: monthly
    nature: coincident        # 渗透率是终端需求的直接度量，反映市场当期实际销售结构
    ifind_index_id: ~         # 已内嵌，来源：乘联会
    use_for: >
      渗透率是新能源汽车行业发展阶段的核心指标。
      关键阈值：15%（早期采用阶段结束）→ 25%（主流化加速）→ 50%（成熟期，增速放缓）。
      渗透率月度环比提升>1.5pct 是加仓信号；同比增速放缓至<5pct 需警惕需求见顶。
      结合电池装车量交叉验证：渗透率加速+装车量同比>40% = 高置信度牛市。
    source: 乘联会, via data file
    update:
      method: manual
      last_updated: "2026-03"
      next_expected: "2026-04"   # 乘联会每月10日前后发布上月数据
      note: >
        数据来源：乘联会官网（http://www.caam.org.cn/）月度销量快报，或搜索iFinD EDB
        关键词"新能源乘用车 渗透率"获取对应指标ID后自动更新。

  - file: battery_installation_monthly.csv
    name: 动力电池装车量（MWh，当月值）
    columns: [date, installation_mwh, yoy_pct]
    frequency: monthly
    nature: coincident        # 装车量与终端新能源车销量同步，是电池需求的直接度量
    ifind_index_id: S006584417   # 动力电池装车量:合计:当月值
    ifind_index_id_yoy: S009363770  # 动力电池装车量:合计:当月同比
    use_for: >
      验证电池需求的真实强度，作为渗透率的数量化补充。
      用法：当装车量同比>40%时，电池产业链（宁德时代、CATL供应商等）进入高景气；
      同比转负时需考虑减仓。月度绝对量（MWh）创新高是产业链持续受益的依据。
      注意季节性：Q4通常为全年最强月，Q1相对偏弱。
    source: 中国汽车动力电池产业创新联盟, via iFinD (S006584417)
    update:
      method: ifind_edb
      ifind_query: "get_edb_data(index_ids=['S006584417','S009363770'], start_date='YYYYMMDD', end_date='YYYYMMDD')"
      last_updated: "2026-03"
      next_expected: "2026-05"   # 通常次月10-15日发布
      note: >
        数据起始2017-01，总量约111条，iFinD可一次性获取全量。
        更新时调用get_edb_data(['S006584417','S009363770'])，将新增行追加至文件。

  - file: battery_production_legacy.csv
    name: 动力电池月度产量（GWh）【遗留文件，已被装车量数据替代】
    columns: [date, production_gwh]
    frequency: monthly
    nature: coincident
    ifind_index_id: ~
    use_for: >
      【已废弃，仅供历史对比】产量数据含库存累积，不如装车量贴近终端需求。
      新分析请优先使用 battery_installation_monthly.csv。
    source: 中国汽车动力电池产业创新联盟
    update:
      method: deprecated
      note: 此文件不再更新，使用 battery_installation_monthly.csv 替代。

clock_logic: >
  新能源汽车产业时钟（渗透率驱动型，非典型周期，呈S曲线增长）：

  1. 【早期加速】渗透率<15%，月度环比持续提升 → 早期采用者驱动，增速快但基数低
  2. 【主流突破】渗透率穿越25% → 中产/大众市场开始接受，装车量同比>50%
  3. 【高速成长】渗透率25-50%，装车量绝对量创新高 → 电池、材料、设备全线受益
  4. 【增速放缓】渗透率>50%，同比增速下台阶至<20% → 成熟期，盈利改善比规模更重要
  5. 【格局分化】渗透率趋稳，价格战激烈 → 头部电池企业受益，二线产能退出

  验证基金经理产业时钟感的关键节点：
  - 2022年：渗透率从15%快速攀升至25%，是否在年初就重仓电池/整车？
  - 2023年：渗透率超30%，装车量同比仍高，但碳酸锂暴跌，是否识别出上游与中下游分化？
  - 2024年：渗透率超45%，增速放缓，价格战激烈，是否及时调整至出海/储能方向？

caveats:
  - 渗透率数据来源乘联会（乘用车口径），与商用车合并口径有差异
  - 装车量单位为MWh（电量），与车辆台数口径不同，大电池车型（增程式）会放大装车量数值
  - 中国新能源汽车受补贴政策（国补、地补）影响显著，政策退坡期数据会有明显波动
  - 2023年后渗透率数据包含增程式车型，与纯电占比趋势存在差异，需分型号追踪
