industry_cn: 上游原材料
industry_en: upstream_materials
scope: >
  覆盖新能源产业链三大核心上游原材料的现货价格：碳酸锂（电池级）、氧化镨钕（磁材/电机）、LME铜（电气化）。
  价格数据是判断新能源整体成本曲线和上游景气的高频领先信号。
  典型持仓包括赣锋锂业、天齐锂业、盛和资源、中国稀土、铜矿相关标的（紫金矿业、洛阳钼业）等。
typical_managers:
  - 华商伍文友
  - 宏利基金孙硕

indicators:
  - file: lithium_carbonate_weekly.csv
    name: 碳酸锂现货均价（元/吨，电池级，华东）
    columns: [date, avg_price_rmb_per_ton, source, note]
    frequency: weekly
    nature: leading           # 锂价领先电池成本约1-2个季度，是新能源车产业链成本的风向标
    ifind_index_id: S020190575   # 平均价:碳酸锂:电池级(Li2CO3≥99.5%):华东
    use_for: >
      碳酸锂价格是新能源产业链上游景气的核心先行指标。
      价格大幅下跌 → 电池成本降低 → 新能源车降价 → 渗透率加速（对下游利好，对上游利空）。
      关键价格区间：>40万元/吨（高景气，上游受益）；20-40万（过渡区间）；<10万（深度产能过剩，上游亏损）。
      用法：锂价企稳反弹+电池装车量加速，可布局中游电池企业；锂价暴跌期应减持上游锂矿企业。
    source: 上海有色网(SMM)/百川资讯, via iFinD (S020190575)
    update:
      method: ifind_edb
      ifind_query: "get_edb_data(index_ids=['S020190575'], start_date='YYYYMMDD', end_date='YYYYMMDD')"
      last_updated: "2026-04-24"
      next_expected: "2026-04-25"   # 每个交易日更新，周度汇总取周末均值
      note: >
        iFinD每次返回最近约60条日频记录（约3个月）。如需历史数据，需分批拉取：
          start_date='20230101', end_date='20231231' → 约250条
          start_date='20220101', end_date='20221231' → 约250条
          start_date='20210101', end_date='20211231' → 约250条
        历史参考：2022年底约56万元/吨（历史峰值），2023年底约10万元/吨，2024年约7-8万元/吨。
        当前文件仅覆盖2026年初约13周，历史数据空缺较大，使用时需注意。

  - file: praseodymium_neodymium_weekly.csv
    name: 氧化镨钕均价（元/kg，≥99%）
    columns: [date, avg_price_rmb_per_kg, source, note]
    frequency: weekly
    nature: leading           # 钕铁硼磁材是新能源电机和风电主轴的核心原料，价格领先设备/整车约1-2季度
    ifind_index_id: S008618398   # 平均价:氧化镨钕(≥99%Nd2O3 75%):稀土协会
    use_for: >
      氧化镨钕价格是新能源电机（新能源汽车驱动电机、风电直驱电机）成本的核心先行指标。
      价格上涨 → 磁材企业（金力永磁、正海磁材）成本上升但价格转嫁，上游稀土受益；
      价格下跌 → 磁材盈利改善，但稀土矿企（北方稀土、盛和资源）承压。
      关键价格区间：>100元/kg（稀土供应紧张）；60-80元（正常区间）；<50元（产能过剩）。
      用法：价格连续上涨+稀土出口政策收紧 → 加仓上游；价格下行 → 关注磁材中游。
    source: 中国稀土行业协会, via iFinD (S008618398)
    update:
      method: ifind_edb
      ifind_query: "get_edb_data(index_ids=['S008618398'], start_date='YYYYMMDD', end_date='YYYYMMDD')"
      last_updated: "2026-04-24"
      next_expected: "2026-04-25"   # 每个交易日更新
      note: >
        iFinD每次返回最近约60条日频记录（约3个月）。历史数据需分批拉取（同碳酸锂方式）。
        数据起始2013-06-26，历史完整但每次只能获取最近3个月。
        当前文件仅覆盖2026年初约13周，历史数据空缺较大，使用时需注意。
        历史参考：2022年钕铁硼磁性材料概念炒作期，氧化镨钕峰值约200元/kg。

  - file: copper_lme_weekly.csv
    name: LME铜现货结算价（美元/吨）
    columns: [date, spot_settlement_usd_per_ton, source, note]
    frequency: weekly
    nature: leading           # 铜价是全球电气化程度的宏观先行指标，领先制造业PMI约1-2个季度
    ifind_index_id: S000025453   # 现货结算价:LME铜
    use_for: >
      铜价是电气化大趋势（新能源车、充电桩、电网投资、风电光伏）的宏观成本锚。
      铜价上涨 → 新能源建设成本上升（电线/变压器），但反映全球需求旺盛，通常对铜矿受益；
      铜价持续强势（>9500美元/吨）同时新能源车销量加速 → 铜矿+导体材料双受益。
      用法：铜价与新能源板块通常正相关（同受全球经济周期驱动），铜价领先判断电气化需求。
      关键价格区间：>10000美元/吨（超级周期）；7000-9500（正常景气）；<7000（需求疲软）。
    source: LME（伦敦金属交易所）, via iFinD (S000025453)
    update:
      method: ifind_edb
      ifind_query: "get_edb_data(index_ids=['S000025453'], start_date='YYYYMMDD', end_date='20260427')"
      last_updated: "2026-04-24"
      next_expected: "2026-04-25"   # 每个交易日更新
      note: >
        LME数据从1990年起，总量巨大。iFinD拉取时务必指定start_date，否则返回过多数据影响性能。
        当前文件覆盖2024-01至2026-04（121周），建议每次增量更新，指定最近3-6个月范围。
        增量更新示例: get_edb_data(['S000025453'], start_date='20260101', end_date='20260427')
        将新增周数据（聚合方式：取一周最后一个交易日日期，周内日均价均值）追加至文件。

clock_logic: >
  上游原材料产业时钟（价格驱动型，强周期，受全球供需格局和政策双重影响）：

  三大指标联动逻辑：
  - 铜价领涨 → 全球电气化需求启动信号
  - 碳酸锂/氧化镨钕领涨 → 新能源专属需求爆发，产业链上游博弈
  - 三者同时上涨 → 新能源超级周期（罕见，仅2021-2022出现过）

  典型场景：
  1. 【景气启动】铜价率先上涨，碳酸锂随后跟涨 → 新能源需求在全球制造业复苏中先行受益
  2. 【上游博弈】碳酸锂价格超历史高位 → 下游电池厂商寻求替代（磷酸铁锂替代三元）
  3. 【价格崩塌】产能大幅扩张后价格腰斩（典型：锂价2023年从280万→10万元/吨） → 上游企业大幅亏损
  4. 【底部确认】价格跌至全行业现金流成本线附近，减产信号出现 → 可逐步布局上游

  验证基金经理产业时钟感的关键节点：
  - 2021年底至2022年：碳酸锂从5万涨至55万元/吨，是否提前布局赣锋/天齐？
  - 2023年：锂价暴跌全年，是否在Q1/Q2即识别供应过剩并减仓上游？
  - 2024-2025年：铜价创历史新高（>10000美元/吨），是否配置铜矿/铜箔？

caveats:
  - 碳酸锂和氧化镨钕的iFinD数据每次仅返回最近约60个交易日，历史追溯需多次分批拉取
  - 锂价近年波动极大（数十倍振幅），单纯技术趋势跟踪风险较高，需结合供需平衡表
  - 氧化镨钕受稀土配额政策管控，中国政府出口禁令等政策事件会造成价格跳跃，非市场化波动
  - LME铜价以美元计价，人民币汇率变化会影响铜在国内的实际成本
  - 上游材料价格与A股相关股票股价的传导存在滞后（约1-2个季度），不宜直接用作择时信号
