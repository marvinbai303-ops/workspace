files:
  - file: manager_profiles.csv
    description: 基金经理基本档案（代码、公司、任职起始、类型、行业方向、规模）
    columns: [manager_name, fund_code, fund_name, company, tenure_start, tenure_start_note, manager_type, primary_industries, current_fund_aum_bn, total_managed_aum_bn, education, data_date]
    update:
      method: manual_or_ifind
      ifind_tools: [get_fund_profile, search_funds]
      frequency: quarterly
      last_updated: "2026-04"

  - file: fund_performance.csv
    description: 基金近1年/近3年收益率、规模、股票仓位（截至2026-04-28）
    columns: [fund_code, manager_name, data_date, return_1y_pct, return_3y_pct, aum_bn_2024q4, equity_ratio_pct_2024q4, data_source]
    update:
      method: ifind
      ifind_tools: [get_fund_market_performance, get_fund_financials]
      frequency: monthly
      last_updated: "2026-04"
      note: >
        孙硕(001170.OF)近1年收益率iFinD未返回数据，可能是近1年因净值计算口径问题。
        更新示例: get_fund_market_performance("001170.OF 近1年收益率、近3年收益率")

  - file: fund_turnover.csv
    description: 2024年全年换手率（双边/单边最大值）
    columns: [fund_code, manager_name, year, turnover_rate_pct, turnover_rate_max_pct, note, data_source]
    update:
      method: ifind
      ifind_tools: [get_fund_financials]
      frequency: annual
      last_updated: "2024"
      note: >
        刘元海(001323)和孙硕(001170)仅有单边最大值，标准双边换手率未返回。
        每年年报发布后（约次年4月）更新：
        get_fund_financials("001323.OF 在2025-12-31的换手率")

  - file: fund_top10_holdings.csv
    description: 前十大重仓股多季度数据（市值单位：百万元），含2024Q4/2025Q4/2026Q1三个报告期
    columns: [fund_code, manager_name, report_date, rank, stock_name, stock_code, mkt_value_mn_rmb]
    report_dates: ["2024-12-31", "2025-12-31", "2026-03-31"]
    update:
      method: ifind
      ifind_tools: [get_fund_portfolio]
      frequency: quarterly
      last_updated: "2026-03-31"
      note: >
        每季度末后约1个月（即1月/4月/7月/10月）更新。
        更新示例：get_fund_portfolio("000411.OF 2026年二季报前十大重仓股名称和持股市值")
        用新数据追加行（report_date填新季报日期，如2026-06-30）。
        注意：iFinD查询格式推荐"XXXXXX.OF 在YYYY-MM-DD披露报告中的前十大重仓股"
        或"XXXXXX.OF YYYY年X季报前十大重仓股名称和持股市值"。

industry_mapping:
  # 持仓股票到产业时钟行业的映射（用于cross-check）
  semiconductor:
    keywords: [光模块, PCB, AI芯片, 半导体, 存储, 射频, 服务器, IDC, 算力, 光纤, 光器件]
    typical_stocks: [新易盛, 中际旭创, 德科立, 天孚通信, 沪电股份, 深南电路, 生益电子, 生益科技,
                     寒武纪, 海光信息, 兆易创新, 豪威集团, 晶方科技, 水晶光电, 英维克, 光环新网,
                     源杰科技, 胜宏科技, 仕佳光子, 腾景科技, 东山精密, 鼎泰高科, 长芯博创,
                     澜起科技, 亨通光电, 长飞光纤, 长飞光纤光缆, 永鼎股份, 剑桥科技, 光库科技,
                     中天科技, 烽火通信, 工业富联, 大族数控, 江南新材, 宏和科技]
  new_energy_vehicle:
    keywords: [新能源车, 汽车电子, 动力电池, 汽车零部件]
    typical_stocks: [宁德时代, 拓普集团, 德赛西威, 伯特利, 立讯精密, 歌尔股份,
                     蓝思科技, 赣锋锂业, 天赐材料]
  photovoltaic:
    keywords: [光伏, 多晶硅, 组件, 逆变器]
    typical_stocks: [通威股份, 钧达股份]
  consumer_internet:
    keywords: [互联网, 消费, 游戏, 电商, 品牌, 零售]
    typical_stocks: [腾讯控股, 阿里巴巴-W, 贝壳-W, 中国中免, 贵州茅台, 牧原股份,
                     巨人网络, 世纪华通, 三只松鼠, 万辰集团, 华利集团]

scoring_notes: >
  产业时钟吻合度评分关键维度（参考SKILL.md详细说明）：
  1. 行业配置与产业时钟阶段是否吻合（主要看top10持仓对应哪个时钟位置）
  2. 换手率是否与行业景气变化节点一致（高换手=频繁轮动，低换手=坚守）
  3. 当前重仓行业的持续跟踪（结合 data/<行业>/_manifest.yaml 中的 clock_logic）

  注意事项：
  - 持仓数据为季报披露口径，存在约45-90天滞后
  - 最新季度（2026Q1）全体经理均已重仓光模块/光纤/PCB产业链（AI算力基础设施）
  - 莫海波（519181）2026Q1持仓大幅分散：AI算力+消费（茅台/中免/牧原）混合，轮动特征明显
  - 曹晋（009914）2025Q4起已从港股消费转向AI算力链，但仍保留港股（贝壳/腾讯）
  - 刘元海（001323）2026Q1新增赣锋锂业+天赐材料，出现锂电产业链配置信号
