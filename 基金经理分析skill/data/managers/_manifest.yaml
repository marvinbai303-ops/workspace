directory: managers
description: >
  8位成长型基金经理的档案、业绩、换手率与持仓数据。
  数据来源：iFinD同花顺MCP工具（get_fund_profile / get_fund_market_performance /
  get_fund_financials / get_fund_portfolio），截至2026-04-28拉取。

managers:
  - name: 张仲维
