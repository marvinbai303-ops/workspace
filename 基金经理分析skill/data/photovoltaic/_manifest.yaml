industry_cn: 光伏
industry_en: photovoltaic
scope: >
  覆盖光伏产业链从上游硅料价格到终端装机需求的全链条景气追踪。
  典型持仓包括隆基绿能、通威股份、阳光电源、TCL中环、固德威等。
typical_managers:
  - 宏利基金孙硕
  - 东吴刘元海

indicators:
  - file: polysilicon_price_weekly.csv
    name: 多晶硅料现货均价（元/kg，致密料）
    columns: [date, avg_price_rmb_per_kg, source, note]
    frequency: weekly
    nature: leading           # 硅料是光伏产业链最上游，价格领先组件/装机约2-3个月
    ifind_index_id: S004414890   # 现货价:多晶硅料(致密料):平均价
    use_for: >
      硅料价格是光伏产业链景气的最灵敏先行指标。价格大幅下跌（跌破成本线）→ 上游减产 →
      供需再平衡 → 价格筑底 → 组件价格稳定 → 装机加速。
      关键价格区间：2023年以前>200元/kg为高景气；2024年后产能过剩，<40元/kg为行业深度亏损区间。
      用法：当硅料价格连续4周止跌企稳，结合装机数据加速，可视为产业链底部信号。
    source: InfoLink, via iFinD (S004414890)
    update:
      method: ifind_edb
      ifind_query: "get_edb_data(index_ids=['S004414890'], start_date='YYYYMMDD', end_date='YYYYMMDD')"
      last_updated: "2026-04-22"
      next_expected: "2026-04-29"   # 每周更新
      note: >
        iFinD每次返回最近约60条周度记录（约15个月）。当前文件覆盖2025-02至2026-04。
        如需2023-2024年历史数据，需分批拉取：
          第一批: start_date='20230101', end_date='20231231'
          第二批: start_date='20240101', end_date='20241231'
        历史硅料价格参考：2022年底~280元/kg，2023年底~65元/kg，2024年底~35元/kg。

  - file: pv_installation.csv
    name: 光伏新增装机累计值（GW）
    columns: [date, cumulative_gw]
    frequency: monthly
    nature: coincident        # 装机反映当期实际需求，是景气的同步验证指标
    ifind_index_id: ~         # 已内嵌，来源：国家能源局
    use_for: >
      验证终端装机需求是否兑现。累计同比>30%意味着旺盛需求；与硅料价格交叉验证：
      硅料跌价+装机加速 = 量增价跌的产能过剩格局，对上游不利，对系统集成/逆变器有利。
      季节性规律：Q1装机通常偏弱，Q4冲量；同比口径比绝对值更有参考价值。
    source: 国家能源局, via data file
    update:
      method: manual
      last_updated: "2026-02"
      next_expected: "2026-04"   # 国家能源局每月中旬发布上月数据
      note: >
        数据来源：国家能源局官网（http://www.nea.gov.cn/）新能源装机月报。
        或可通过iFinD EDB搜索"光伏 新增装机 当月"获取对应指标ID后自动更新。

clock_logic: >
  光伏产业时钟（典型周期18-36个月，近年受政策驱动波动加大）：

  1. 【底部信号】硅料价格跌至成本线附近（<30-40元/kg）+ 装机增速边际改善 → 产能出清开始
  2. 【复苏信号】硅料价格止跌+装机累计同比>25% → 需求真实，组件企业盈利修复
  3. 【上行周期】大型地面电站项目核准加速 + 硅料价格温和回升 → 一体化龙头受益
  4. 【顶部预警】新增产能持续超装机增速 + 硅料价格再次承压 → 供给过剩格局延续
  5. 【下行陷阱】装机数据好但硅料/组件价格持续下跌 → 量增价跌，利润被消化，需警惕

  验证基金经理产业时钟感的关键节点：
  - 2022Q1~Q2：硅料价格突破200元/kg，是否提前意识到供应紧张并布局上游通威/大全？
  - 2023Q1~Q2：硅料暴跌从280→100元/kg，是否及时从上游切换到组件/逆变器？
  - 2024年：硅料跌破40元/kg，全产业链亏损，头部基金是否大幅减持光伏？

caveats:
  - 硅料价格2023年以后波动加大，单纯价格趋势判断容易滞后，需结合供需平衡表
  - 光伏装机受补贴政策、并网政策影响显著，纯数据分析有遗漏政策变量的风险
  - 硅料价格使用"致密料"现货均价，与"菜花料"存在价差，不同原料适用性存在差异
  - 多晶硅料周度价格来自InfoLink报价，非实际成交价，存在一定滞后性
